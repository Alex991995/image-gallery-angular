<app-hero-banner>
  <div class="hero-banner__content">
    <h2 class="hero-banner__title">Let's Find Some</h2>
    <h2 class="hero-banner__title"><span>Images</span> Here!</h2>
  </div>
</app-hero-banner>

<div class="category-grid" role="list">
  @for (c of arrayCategories(); track $index) {
    <a class="card" [routerLink]="['/images', c.slug]">
      <img class="card__image" [src]="c.image" alt="category" />
      <span class="card__label">{{ c.name }}</span>
    </a>
  }
</div>
