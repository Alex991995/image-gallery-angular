<header class="header">
  <nav class="nav" [class.padding]="isMenuOpen()">
    <div [class.order]="isMenuOpen()">
      <img src="/logo.svg" alt="logo" />
    </div>
    <button class="burger" (click)="toggleMenu()">
      <img src="/icons/burger.svg" alt="burger" />
    </button>
    <ul class="list" [class.open]="isMenuOpen()">
      <a
        routerLink="/"
        routerLinkActive="selected"
        class="list__item"
        (click)="closeMenu()"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <div class="img img__category"></div>
        <span class="list__text">Category</span>
      </a>

      <a routerLink="/images" routerLinkActive="selected" class="list__item" (click)="closeMenu()">
        <div class="img img__images"></div>
        <span class="list__text">Images</span>
      </a>
      <a
        routerLink="/favourites"
        routerLinkActive="selected"
        class="list__item"
        (click)="closeMenu()"
      >
        <div class="img img__bookmark"></div>
        <span class="list__text">Favourites</span>
      </a>
      <div class="list__socials" [class.open]="isMenuOpen()">
        <img src="/social/twitter.svg" alt="twitter" />
        <img src="/social/facebook-white.svg" alt="facebook" />
        <img src="/social/instagram.svg" alt="instagram" />
        <img src="/social/github.svg" alt="github" />
      </div>
    </ul>
  </nav>
</header>
